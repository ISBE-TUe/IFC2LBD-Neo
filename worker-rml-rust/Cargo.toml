[package]
name = "worker-rml-rust"
version = "0.1.0"
edition = "2021"
description = "High-performance RML worker service using Rust RML Mapper"
license = "Apache-2.0"

[dependencies]
# RML Mapper library (path for local dev, copied in Docker build)
rml_mapper = { path = "../../../rust_rml_mapper" }

# HTTP server
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Utilities
uuid = { version = "1.11", features = ["v4"] }
tempfile = "3.12"

[dev-dependencies]
# Integration tests hit a live worker container over HTTP.
# Run with: cargo test --test integration (container must be up).
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
