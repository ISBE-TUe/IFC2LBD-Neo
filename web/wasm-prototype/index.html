<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IFC2LBD-Neo Pipeline</title>
  </head>
  <body>
    <div class="pipeline-app" id="pipeline-view">

      <!-- Top Bar: just brand + transport -->
      <div class="top-bar">
        <img class="brand-logo" src="/TUe-logo-square-black.png" alt="TU/e" />
        <span class="brand-name">IFC2LBD-NEO</span>
        <span class="top-spacer"></span>
        <span class="top-info" id="runtime-info"></span>
        <button class="run-btn top-btn" id="btn-run">▶ RUN</button>
      </div>

      <!-- Middle: left rail + session grid -->
      <div class="middle-row">
        <!-- Left sidebar: everything that isn't the pipeline graph -->
        <div class="left-rail" id="left-rail">
          <div class="rail-section">
            <label class="rail-file-btn" id="rail-file-btn">
              <span class="rail-file-text" id="rail-file-text">Choose IFC file…</span>
              <input type="file" id="file-input" accept=".ifc,.ifczip,.step,.stp" />
            </label>
            <div class="rail-file-meta" id="rail-file-meta"></div>
          </div>
          <div class="rail-section">
            <div class="rail-field">
              <span class="rail-field-label">Preset</span>
              <select class="rail-select" id="template-picker">
                <option value="">Custom</option>
              </select>
            </div>
          </div>
          <div class="rail-section">
            <div class="rail-field">
              <span class="rail-field-label">Base IRI</span>
              <input type="text" class="rail-input" id="base-uri-input" value="https://lbd.example.com/" />
            </div>
            <div class="rail-field">
              <span class="rail-field-label">Stem</span>
              <input type="text" class="rail-input" id="output-stem-input" value="converted-model" />
            </div>
          </div>
          <div class="rail-section">
            <div class="rail-field rail-field-toggles">
              <label class="rail-toggle-item">
                <input type="checkbox" class="rail-toggle" id="toggle-preprocess" />
                <span class="rail-toggle-label">Pre</span>
              </label>
              <label class="rail-toggle-item">
                <input type="checkbox" class="rail-toggle" id="toggle-postprocess" />
                <span class="rail-toggle-label">Post</span>
              </label>
            </div>
          </div>
          <div class="rail-section rail-bottom">
            <button class="rail-btn" id="btn-load">Load config</button>
            <button class="rail-btn" id="btn-save">Save config</button>
          </div>
        </div>

        <!-- Session Grid -->
        <div class="session-area" id="session-area"></div>
      </div>

      <!-- Bottom Bar -->
      <div class="bottom-bar">
        <div class="downloads-bar" id="downloads"><span class="downloads-empty">No files.</span></div>
        <div class="log-bar">
          <div class="log-header" id="log-toggle">▾ LOG</div>
          <div id="log-output"></div>
        </div>
      </div>

      <!-- Detail Panel -->
      <div class="panel-backdrop" id="detail-backdrop"></div>
      <div class="detail-panel" id="detail-panel">
        <div class="detail-header">
          <span class="detail-title">Plugin Detail</span>
          <button class="detail-close" id="detail-close">✕</button>
        </div>
        <div class="detail-body" id="detail-content">
          <div class="detail-empty">Click a pipeline node for details.</div>
        </div>
      </div>
    </div>

    <div id="mobile-view" style="display:none"></div>

    <script>
      const isMobile = window.innerWidth < 900;
      if (isMobile) {
        document.getElementById("pipeline-view").style.display = "none";
        document.getElementById("mobile-view").style.display = "block";
        const s = document.createElement("script");
        s.type = "module";
        s.textContent = `import './src/main.js';`;
        document.head.appendChild(s);
      } else {
        document.getElementById("mobile-view").remove();
        const s = document.createElement("script");
        s.type = "module";
        s.textContent = `import './src/pipeline/app.js';`;
        document.head.appendChild(s);
      }
    </script>
  </body>
</html>
