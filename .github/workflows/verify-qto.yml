# Verify the QTO geometry backend, including the parts that are awkward to
# build locally.
#
# The `occt` feature links a prebuilt OpenCASCADE through cadrum. It is off by
# default, so the release workflows never build it — which means nothing would
# catch it breaking. This workflow does, on every platform the CLI ships to,
# plus wasm32-unknown-unknown.
#
# Deliberately separate from build-cli.yml: a failure here must not block a
# release, because the feature is not in the released binaries.

name: Verify QTO

on:
  push:
    branches: [main]
    paths:
      - "crates/qto-geometry/**"
      - "crates/plugin-qto-preprocess/**"
      - "crates/qto-validate/**"
      - ".github/workflows/verify-qto.yml"
      - "Cargo.toml"
  pull_request:
    paths:
      - "crates/qto-geometry/**"
      - "crates/plugin-qto-preprocess/**"
      - "crates/qto-validate/**"
  workflow_dispatch:

jobs:
  # The default build must stay free of cadrum: enabling it by default would
  # force a C++ toolchain on every contributor and break the WASM image.
  default-build-has-no-occt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: qto-default
      - name: Assert cadrum is absent from the default dependency graph
        run: |
          if cargo tree -p qto-geometry | grep -q cadrum; then
            echo "::error::cadrum is in the default build; it must stay behind the occt feature"
            cargo tree -p qto-geometry | grep -B3 cadrum
            exit 1
          fi
          echo "cadrum absent from the default graph"
      - name: Build and test without the feature
        run: |
          cargo build -p qto-geometry -p plugin-qto-preprocess -p qto-validate
          cargo test -p qto-geometry -p plugin-qto-preprocess

  occt-native:
    name: occt / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: qto-occt-${{ matrix.os }}
      # cadrum downloads a prebuilt OCCT for these targets, so no CMake or
      # system OpenCASCADE is needed. If that ever changes this step is where
      # it will surface.
      - name: Build with occt
        run: cargo build -p qto-geometry --features occt
      - name: Test with occt
        run: cargo test -p qto-geometry --features occt
      - name: Test the plugin with occt
        run: cargo test -p plugin-qto-preprocess --features occt

  # The claim this project relies on: the same geometry backend runs on the web
  # target and agrees with native. cadrum publishes the wasi-sdk toolchain as a
  # container, so no local toolchain is involved.
  occt-wasm32:
    runs-on: ubuntu-latest
    container: ghcr.io/lzpel/cross-wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v4
      - name: Build qto-geometry with occt for wasm32-unknown-unknown
        run: cargo build -p qto-geometry --features occt

  # The WASM image carries wasi-sdk so the same build works from this repo's own
  # toolchain rather than only from cadrum's container.
  wasm-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the WASM image
        run: docker build -t ifc2lbd-wasm .
      - name: Check the image can target wasm32 C++
        run: |
          docker run --rm ifc2lbd-wasm \
            /opt/wasi-sdk/bin/clang++ --print-targets | grep -q wasm32
          echo "wasi-sdk present and targeting wasm32"
