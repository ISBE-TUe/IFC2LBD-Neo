name: Deploy Web Prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly + wasm targets
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
          # wasm64-unknown-unknown is a Tier 3 target — no pre-built std,
          # but -Z build-std (in build_wasm_web.sh) handles it. We only
          # need rust-src (already listed) for the std rebuild.

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm-web

      - name: Cache wasm-bindgen-cli
        uses: actions/cache@v4
        id: cache-wbg
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wbg-cli-${{ hashFiles('vendor/wasm-bindgen-cli-0.2.126/Cargo.toml', 'vendor/wasm-bindgen-cli-support-0.2.126/src/**/*.rs') }}

      - name: Install wasm-bindgen-cli (patched for wasm64 threading)
        if: steps.cache-wbg.outputs.cache-hit != 'true'
        run: cargo install --path vendor/wasm-bindgen-cli-0.2.126 --force

      - name: Install wabt + binaryen (wasm2wat/wat2wasm for memory patch, wasm-opt for size)
        run: sudo apt-get install -y wabt binaryen

      # To enable wasm64 builds (~3-4 min extra), set VITE_ENABLE_WASM64=true
      # as an environment variable here and on the Vite build step below.
      # Default: only wasm32 is built; the UI shows a warning popup for files
      # that exceed the 4 GiB wasm32 memory cap.
      - name: Build WASM
        run: bash scripts/build_wasm_web.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/wasm-prototype/package-lock.json

      - name: Install JS dependencies
        working-directory: web/wasm-prototype
        run: npm ci

      - name: Build Vite app
        working-directory: web/wasm-prototype
        run: npm run build

      - name: Create Cloudflare Pages project if absent
        working-directory: web/wasm-prototype
        run: npx wrangler pages project create ifc2lbd-neo --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ifc2lbd-neo --commit-dirty=true
          workingDirectory: web/wasm-prototype
