# Build Electron desktop apps for macOS and Windows.
#
# Triggered after build-cli.yml completes (via workflow_run) so the CLI
# binaries are available in the GitHub Release. This workflow:
#   1. Builds the web app (Vite) → dist/
#   2. Copies dist/ → electron/renderer/
#   3. Downloads CLI binaries from the release
#   4. Bundles everything into platform-specific Electron installers
#   5. Uploads installers to the same release

name: Build Desktop Apps

on:
  workflow_run:
    workflows: ["Build CLI Binaries"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must already exist with CLI binaries)"
        required: true
        default: "v0.1.0"

jobs:
  get-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      valid: ${{ steps.resolve.outputs.valid }}
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG="${{ github.event.workflow_run.head_branch }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "valid=true" >> $GITHUB_OUTPUT

  # ── macOS (Apple Silicon) ─────────────────────────────────────────────────
  build-macos:
    needs: get-tag
    if: needs.get-tag.outputs.valid == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/wasm-prototype/package-lock.json

      # 1. Build the web app (Vite) — produces dist/
      - name: Install web dependencies
        working-directory: web/wasm-prototype
        run: npm ci

      - name: Build web app
        working-directory: web/wasm-prototype
        run: npm run build

      # 2. Copy built web app into electron/renderer/
      - name: Stage renderer
        run: |
          mkdir -p electron/renderer
          cp -r web/wasm-prototype/dist/* electron/renderer/

      # 3. Install Electron dependencies
      - name: Install Electron dependencies
        working-directory: electron
        run: npm install

      # 4. Download CLI binary from the release
      - name: Download macOS CLI binary from release
        uses: robinraju/release-download@v1.10
        with:
          tag: ${{ needs.get-tag.outputs.tag }}
          fileName: ifc2lbd-neo-macos
          outPath: /tmp/cli-download

      - name: Stage CLI binary
        run: |
          mkdir -p electron/resources/bin/macos
          chmod +x /tmp/cli-download/ifc2lbd-neo-macos
          cp /tmp/cli-download/ifc2lbd-neo-macos electron/resources/bin/macos/ifc2lbd-neo

      # 5. Build the Electron app
      - name: Build Electron app (macOS)
        working-directory: electron
        run: npx electron-builder --mac --arm64

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ifc2lbd-neo-desktop-macos
          path: electron/release/*.dmg
          if-no-files-found: error

  # ── Windows (x86_64) ──────────────────────────────────────────────────────
  build-windows:
    needs: get-tag
    if: needs.get-tag.outputs.valid == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/wasm-prototype/package-lock.json

      # 1. Build the web app (Vite) — produces dist/
      - name: Install web dependencies
        working-directory: web/wasm-prototype
        run: npm ci

      - name: Build web app
        working-directory: web/wasm-prototype
        run: npm run build

      # 2. Copy built web app into electron/renderer/
      - name: Stage renderer
        shell: bash
        run: |
          mkdir -p electron/renderer
          cp -r web/wasm-prototype/dist/* electron/renderer/

      # 3. Install Electron dependencies
      - name: Install Electron dependencies
        working-directory: electron
        run: npm install

      # 4. Download CLI binary from the release
      - name: Download Windows CLI binary from release
        uses: robinraju/release-download@v1.10
        with:
          tag: ${{ needs.get-tag.outputs.tag }}
          fileName: ifc2lbd-neo-windows.exe
          outPath: /tmp/cli-download

      - name: Stage CLI binary
        shell: bash
        run: |
          mkdir -p electron/resources/bin/win32
          cp /tmp/cli-download/ifc2lbd-neo-windows.exe electron/resources/bin/win32/ifc2lbd-neo.exe

      # 5. Build the Electron app
      - name: Build Electron app (Windows)
        working-directory: electron
        run: npx electron-builder --win --x64

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ifc2lbd-neo-desktop-windows
          path: electron/release/*.exe
          if-no-files-found: error

  # ── Upload installers to GitHub Release ────────────────────────────────────
  upload-to-release:
    needs: [get-tag, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload desktop installers to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-tag.outputs.tag }}
          files: |
            artifacts/ifc2lbd-neo-desktop-macos/*.dmg
            artifacts/ifc2lbd-neo-desktop-windows/*.exe
