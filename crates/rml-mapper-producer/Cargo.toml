[package]
name = "rml-mapper-producer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lbd-pipeline = { workspace = true }
lbd-ontology = { workspace = true }
lbd-converter = { workspace = true }
structured-data = { path = "../structured-data" }
crossbeam = { workspace = true }
rayon = { workspace = true }
rml-mapper-lib = { path = "../rml-mapper-lib", default-features = false }

# tempfile uses getrandom 0.4 which doesn't support wasm64.  On WASM there
# is no filesystem anyway, so the code path is gated with cfg(not(target_family = "wasm")).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tempfile = "3"
