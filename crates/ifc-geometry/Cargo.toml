[package]
name = "ifc-geometry"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []

[dependencies]
ifc-lite-core = { workspace = true }
ifc-lite-geometry = { workspace = true }
nalgebra = { workspace = true }
