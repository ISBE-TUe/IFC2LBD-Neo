[package]
name = "ifc2lbd-wasm"
description = "Browser-facing WebAssembly facade for IFC2LBD-Neo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ifc-step = { workspace = true }
ifc-model = { workspace = true }
lbd-converter = { workspace = true }
lbd-ontology = { workspace = true }
lbd-pipeline = { workspace = true }
lbd-serializer = { workspace = true }
structured-data = { workspace = true }
rml-mapper-producer = { workspace = true }
ontology-mapper-producer = { workspace = true }
plugin-property-preprocess = { workspace = true }
plugin-qto-preprocess = { workspace = true }
plugin-geometry-preprocess = { workspace = true }
# Geometry output formats: fragments + gltf on all targets.
# Parquet is only on wasm32 (arrow-buffer has no wasm64 cfg for ALIGNMENT).
plugin-geometry-producer = { workspace = true, features = [
  "fmt-fragments",
  "fmt-gltf",
] }
tessellated-model = { workspace = true }
crossbeam = { workspace = true }
flate2 = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
serde-wasm-bindgen = { workspace = true }
thiserror = { workspace = true }
percent-encoding = { workspace = true }

# Shared WASM dependencies (both wasm32 and wasm64)
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen-rayon = "1"
console_error_panic_hook = "0.1"
# getrandom 0.2 (pulled in by ring) needs the "js" feature for wasm
getrandom = { version = "0.2", features = ["js"] }
# getrandom 0.4 (pulled in by uuid) needs the "wasm_js" feature.
# The local [patch.crates-io] in the root Cargo.toml adds wasm64 cfg support.
getrandom_0_4 = { package = "getrandom", version = "0.4", features = [
  "wasm_js",
] }

# Parquet requires arrow-buffer, which has no wasm64 cfg for ALIGNMENT.
# Only enable on wasm32. On wasm64, requesting parquet format returns a
# runtime error (see plugin-geometry-producer's cfg(not(feature)) fallback).
[target.'cfg(all(target_family = "wasm", target_arch = "wasm32"))'.dependencies]
plugin-geometry-producer = { workspace = true, features = ["fmt-parquet"] }
