[package]
name = "ifc2lbd-wasm"
description = "Browser-facing WebAssembly facade for IFC2LBD-Neo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ifc-step = { workspace = true }
ifc-model = { workspace = true }
lbd-converter = { workspace = true }
lbd-ontology = { workspace = true }
lbd-pipeline = { workspace = true }
lbd-serializer = { workspace = true }
structured-data = { workspace = true }
rml-mapper-producer = { workspace = true }
plugin-property-preprocess = { workspace = true }
plugin-qto-preprocess = { workspace = true }
plugin-geometry-preprocess = { workspace = true }
# All 3 geometry output formats in WASM: fragments, parquet (Snappy = pure Rust), gltf
plugin-geometry-producer = { workspace = true, features = ["fmt-fragments", "fmt-parquet", "fmt-gltf"] }
tessellated-model = { workspace = true }
crossbeam = { workspace = true }
flate2 = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
serde-wasm-bindgen = { workspace = true }
thiserror = { workspace = true }
percent-encoding = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = "1"
