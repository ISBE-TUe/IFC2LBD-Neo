[package]
name = "ifc2lbd-cli"
description = "ifc2lbd-neo CLI — high-performance IFC-to-LBD converter"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ifc2lbd-neo"
path = "src/main.rs"

[[bin]]
name = "compare-turtle"
path = "src/bin/compare_turtle.rs"

[dependencies]
ifc-step = { workspace = true }
ifc-model = { workspace = true }
ifc-schema = { workspace = true }
lbd-ontology = { workspace = true }
lbd-pipeline = { workspace = true }
lbd-converter = { workspace = true }
lbd-topology = { workspace = true }
lbd-geometry = { workspace = true }
lbd-serializer = { workspace = true }
structured-data = { workspace = true }
rml-mapper-producer = { workspace = true }
plugin-topology-full = { workspace = true }
plugin-property-preprocess = { workspace = true }
plugin-qto-preprocess = { workspace = true }
plugin-geometry-preprocess = { workspace = true }
tessellated-model = { workspace = true }
ifc-geometry = { workspace = true, features = ["proof-bin", "manifold-csg"] }
plugin-geometry-producer = { workspace = true, features = [
  "fmt-fragments",
  "fmt-parquet",
  "fmt-gltf",
] }
crossbeam = { workspace = true }
flate2 = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
rio_api = { workspace = true }
rio_turtle = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rstar = { workspace = true }
percent-encoding = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "conversion"
harness = false
