[workspace]
resolver = "2"
members = [
  "crates/ifc-step",
  "crates/ifc-model",
  "crates/ifc-schema",
  "crates/fragments-schema",
  "crates/fragments-core",
  "crates/lbd-pipeline",
  "crates/lbd-ontology",
  "crates/lbd-converter",
  "crates/lbd-topology",
  "crates/lbd-geometry",
  "crates/lbd-serializer",
  "crates/plugin-topology-full",
  "crates/plugin-template-preprocess",
  "crates/plugin-template-producer",
  "crates/plugin-template-postprocess",
  "crates/plugin-template-export",
  "crates/plugin-property-preprocess",
  "crates/plugin-qto-preprocess",
  # Structured data + RML mapper
  "crates/structured-data",
  "crates/rml-mapper-lib",
  "crates/rml-mapper-producer",
  "crates/ontology-mapper-producer",
  "crates/owl-reasoner",
  # Vendored geometry engine (MPL-2.0)
  "vendor/geometry/core",
  "vendor/geometry/geometry",
  # Geometry pipeline
  "crates/ifc-geometry",
  "crates/tessellated-model",
  "crates/plugin-geometry-preprocess",
  "crates/plugin-geometry-producer",
  "crates/ifc2lbd-cli",
  "crates/ifc2lbd-wasm",
  # "crates/ifc2lbd-python",  # enable when PyO3 bindings are needed
]

[workspace.package]
version = "0.2.7"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.75"

[workspace.dependencies]
# Parsing
memmap2 = "0.9"
smol_str = "0.3"

# Parallelism
rayon = "1.10"
crossbeam = "0.8"
dashmap = "6"

# RDF serialization
rio_api = "0.8"
rio_turtle = "0.8"
oxiri = "0.2"

# Spatial indexing
rstar = "0.12"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.126"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
time = { version = "0.3", features = ["formatting"] }
percent-encoding = "2"
unicode-normalization = "0.1"
strsim = "0.11"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }

# Compression
flate2 = "1"
flatbuffers = "=25.12.19"

# Workspace crate cross-references
ifc-step = { path = "crates/ifc-step" }
ifc-model = { path = "crates/ifc-model" }
ifc-schema = { path = "crates/ifc-schema" }
fragments-schema = { path = "crates/fragments-schema" }
fragments-core = { path = "crates/fragments-core" }
lbd-ontology = { path = "crates/lbd-ontology" }
lbd-pipeline = { path = "crates/lbd-pipeline" }
lbd-converter = { path = "crates/lbd-converter" }
structured-data = { path = "crates/structured-data" }
rml-mapper-lib = { path = "crates/rml-mapper-lib" }
rml-mapper-producer = { path = "crates/rml-mapper-producer" }
ontology-mapper-producer = { path = "crates/ontology-mapper-producer" }
owl-reasoner = { path = "crates/owl-reasoner" }
lbd-topology = { path = "crates/lbd-topology" }
lbd-geometry = { path = "crates/lbd-geometry" }
lbd-serializer = { path = "crates/lbd-serializer" }
plugin-topology-full = { path = "crates/plugin-topology-full" }
plugin-property-preprocess = { path = "crates/plugin-property-preprocess" }
plugin-qto-preprocess = { path = "crates/plugin-qto-preprocess" }
# Geometry pipeline
ifc-geometry = { path = "crates/ifc-geometry" }
tessellated-model = { path = "crates/tessellated-model" }
plugin-geometry-preprocess = { path = "crates/plugin-geometry-preprocess" }
plugin-geometry-producer = { path = "crates/plugin-geometry-producer" }
# ifc-lite (MPL-2.0) — geometry engine, vendored into workspace (WASM-safe, no manifold-csg)
ifc-lite-core = { path = "vendor/geometry/core", default-features = false }
ifc-lite-geometry = { path = "vendor/geometry/geometry", default-features = false }
nalgebra = { version = "0.35", default-features = false, features = ["std"] }

# Patch getrandom 0.4.x to support wasm64-unknown-unknown.  The upstream
# crate only checks target_arch = "wasm32" in its backend selection; this
# local patch adds "wasm64" so the wasm_js backend (wasm-bindgen + js-sys)
# is used on both wasm32 and wasm64 targets.  Only affects getrandom 0.4.x
# — versions 0.2.x and 0.3.x are not patched.
[patch.crates-io]
getrandom = { path = "vendor/getrandom-0.4.2" }
js-sys = { path = "vendor/js-sys-0.3.103" }
wasm-bindgen-cli-support = { path = "vendor/wasm-bindgen-cli-support-0.2.126" }
